name: ci

on:
  push:
    branches:
      - feature/agentic-ux
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run deterministic test suite
        run: python -m pytest tests -q
        # No AWS credentials are provided: this suite is fully hermetic
        # (mock clients, no live Bedrock, no live S3/DynamoDB).